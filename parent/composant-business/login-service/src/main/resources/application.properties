# Configuration Login Service
spring.thymeleaf.cache=false
logging.level.jdbc=OFF
logging.level.jdbc.sqltiming=DEBUG
logging.level.jdbc.resultsettable=DEBUG

# Base de donn\u00E9es PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/parcours
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Serveur
server.servlet.context-path=/loginparcours
server.port=8686

# URL vers le service Personnel (document-service)
url.personnel.api.service=http://localhost:8684/documentparcours

# Traduction DeepL Free API
url.traduction.api.service=https://api-free.deepl.com/v2/translate
traduction.api.key=VOTRE_CLE_DEEPL_ICI

# S\u00E9lecteur de strat\u00E9gie d'acc\u00E8s aux d\u00E9pendances
# injection = appels directs aux interfaces m\u00E9tier (d\u00E9faut, coh\u00E9rence transactionnelle)
# ws = appels HTTP REST vers document-service (d\u00E9ploiement distribu\u00E9)
parcours.gateway.mode=injection
