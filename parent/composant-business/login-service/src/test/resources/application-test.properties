# Configuration de test - H2 en m\u00E9moire
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE;INIT=CREATE SCHEMA IF NOT EXISTS login
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

server.servlet.context-path=/loginparcours
server.port=8686

url.personnel.api.service=http://localhost:9999/mock
url.traduction.api.service=http://localhost:9999/mock/translate
traduction.api.key=test-key

parcours.gateway.mode=injection
